<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.4" />
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <style>
      .terminal-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .glow-badge {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Outer Shadow / Glow -->
  <rect x="10" y="10" width="830" height="220" rx="16" fill="url(#borderGlow)" opacity="0.4" filter="blur(10px)" />

  <!-- Card Border -->
  <rect x="5" y="5" width="840" height="230" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Card Background -->
  <rect x="6" y="6" width="838" height="228" rx="13" fill="url(#bgGradient)" />

  <!-- Ambient Glow Behind Content -->
  <rect x="6" y="6" width="838" height="228" rx="13" fill="url(#ambientGlow)" />

  <!-- Dot Grid Overlay -->
  <rect x="6" y="6" width="838" height="228" rx="13" fill="url(#dotGrid)" />

  <!-- Terminal Top Bar Background -->
  <rect x="6" y="6" width="838" height="38" rx="13" fill="#0f172a" fill-opacity="0.85" />
  <line x1="6" y1="44" x2="844" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Window Traffic Lights (macOS Dots) -->
  <circle cx="28" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="68" cy="25" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="425" y="29" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono-text" letter-spacing="0.5">andika@terminal: ~ /portfolio</text>

  <!-- Status Pill (Top Right) -->
  <g transform="translate(680, 16)">
    <rect width="145" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="10" cy="9" r="3.5" fill="#10b981" class="glow-badge" />
    <text x="20" y="13" fill="#cbd5e1" font-size="9.5" class="mono-text" font-weight="500">Open for Projects</text>
  </g>

  <!-- Main Greeting & Name -->
  <text x="40" y="98" fill="#38bdf8" font-size="14" class="mono-text" font-weight="600" letter-spacing="1">> WHOAMI</text>
  
  <text x="40" y="142" fill="url(#textGradient)" font-size="34" font-weight="800" class="terminal-text" letter-spacing="-0.5">
    Andika Rafa Akbar
    <tspan fill="#38bdf8" class="cursor">_</tspan>
  </text>

  <!-- Subtitle Line -->
  <text x="40" y="176" fill="url(#accentGradient)" font-size="16" font-weight="600" class="terminal-text">
    Frontend-heavy Full-Stack Developer
    <tspan fill="#64748b" font-weight="400"> | </tspan>
    <tspan fill="#cbd5e1" font-weight="400">Informatics @ UPNVJ</tspan>
  </text>

  <!-- Bottom Details / Tags -->
  <g transform="translate(40, 195)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="135" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="67" y="16" fill="#94a3b8" font-size="11" text-anchor="middle" class="mono-text">Web &amp; Mobile</text>

    <!-- Tag 2 -->
    <rect x="145" y="0" width="130" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="210" y="16" fill="#94a3b8" font-size="11" text-anchor="middle" class="mono-text">AI Enthusiast</text>

    <!-- Tag 3 -->
    <rect x="285" y="0" width="180" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="375" y="16" fill="#94a3b8" font-size="11" text-anchor="middle" class="mono-text">Still learning, still making</text>
  </g>
</svg>
